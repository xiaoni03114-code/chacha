name: Sherlock

on:
  workflow_dispatch:
    inputs:
      username:
        description: "要查询的用户名（多个用空格分隔）"
        required: true
        default: "xiaoni03114-code"
  schedule:
    # 每天 UTC 01:00（北京时间 09:00）自动跑一次，不需要可删掉这一段
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  sherlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 sherlock
        run: pip install --upgrade sherlock-project

      - name: 运行查询
        env:
          # 手动触发时用输入值，定时触发时用默认值
          TARGETS: ${{ github.event.inputs.username || 'xiaoni03114-code' }}
        run: |
          mkdir -p results
          sherlock $TARGETS --print-found --no-color 2>&1 | tee results/result.txt

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: sherlock-results
          path: results/
          if-no-files-found: warn
